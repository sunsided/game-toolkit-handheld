[package]
name = "game-toolkit-handheld"
description = "Write a small game once against a no_std framebuffer and input API; run it on ESP32 boards, the Playdate, or on desktop and web through game-toolkit"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
documentation = "https://docs.rs/game-toolkit-handheld"
authors.workspace = true
rust-version.workspace = true
keywords = ["gamedev", "embedded", "esp32", "playdate", "no-std"]
categories = ["game-development", "embedded", "no-std", "graphics"]
readme = "../../README.md"
include = ["src/**", "Cargo.toml"]

[package.metadata.docs.rs]
all-features = true

[features]
## Simulator: run a `HandheldGame` in a game-toolkit window (native and web). Needs `std`.
toolkit = ["dep:game-toolkit", "dep:log"]

[dependencies]
embedded-graphics = { workspace = true }
game-toolkit = { workspace = true, optional = true }
log = { workspace = true, optional = true }

[lints]
workspace = true
