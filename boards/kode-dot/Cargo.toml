[package]
name = "game-toolkit-handheld-kode-dot"
description = "Kode Dot (ESP32-P4) backend for game-toolkit-handheld: run any Rgb565 HandheldGame on the board"
version = "0.1.0"
edition = "2024"
license = "EUPL-1.2"
repository = "https://github.com/sunsided/game-toolkit-handheld"
readme = "README.md"
keywords = ["kode-dot", "esp32p4", "handheld", "game", "embedded"]
categories = ["embedded", "game-development"]
# Nightly comes from rust-toolchain.toml (build-std for a tier-3 target).
rust-version = "1.95"

# Own workspace: this crate needs the ESP-IDF toolchain and target, the root workspace doesn't.
[workspace]

[lib]
test = false # no test harness on the device

[features]
## Run in Wokwi's ESP32-P4: the CO5300, TCA6408A and CST820 run as Wokwi custom chips, the
## panel on SPI since Wokwi has no MIPI-DSI.
wokwi = ["dep:co5300"]

[dependencies]
game-toolkit-handheld = { path = "../../crates/handheld", version = "0.1" }
co5300 = { version = "0.1", optional = true }
cst820 = "0.2"
embedded-hal = "1.0"
esp-idf-svc = "0.53"
log = "0.4"
tca6408a = "0.1"

[dev-dependencies]
game-toolkit-handheld-demos = { path = "../../crates/demos" }

[build-dependencies]
embuild = "0.33"

[package.metadata.esp-idf-sys]
# MIPI-DSI CO5300 driver from Espressif's registry (Apache-2.0). Its bindings join the esp-idf ones
# in `esp_idf_svc::sys` (a separate module would duplicate every esp_lcd type).
extra_components = [
    { remote_component = { name = "espressif/esp_lcd_co5300", version = "2.2.0" }, bindings_header = "src/co5300.h" },
]

[profile.release]
opt-level = "s"
debug = true # symbols only, not flashed

[profile.dev]
debug = true
opt-level = "z"

# Copied from the root workspace's [workspace.lints]; unsafe_code is `deny` (not `forbid`) so the
# one FFI module can opt out.
[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
unused_qualifications = "warn"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
manual_let_else = "warn"
redundant_closure_for_method_calls = "warn"
semicolon_if_nothing_returned = "warn"
uninlined_format_args = "warn"
