[target.xtensa-esp32s3-none-elf]
runner = "espflash flash --monitor --chip esp32s3"

[build]
rustflags = [
  "-C", "link-arg=-nostartfiles",
  # esp-hal's linker script maps IRAM as RWX; that is intended.
  "-C", "link-arg=-Wl,--no-warn-rwx-segments",
]
target = "xtensa-esp32s3-none-elf"

[env]
ESP_LOG = "info"

[unstable]
build-std = ["core"]
