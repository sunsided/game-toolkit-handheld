version: '3'

vars:
  SHOT_DIR: target/shots
  PLAYDATE_SDK: '{{.PLAYDATE_SDK_PATH | default "/home/markus/dev/sdks/PlaydateSDK-3.1.2"}}'
  KODE_SDK: '{{.KODE_SDK_PATH | default "/home/markus/dev/sdks/kode-sdk"}}'

tasks:
  default:
    cmds:
      - task --list
    silent: true

  # --- Try it out -------------------------------------------------------------------------

  maze:
    desc: Color maze in the simulator (QVGA, sound). Arrows/WASD move, Esc quits
    cmds:
      - cargo run -p game-toolkit-handheld-demos --example maze

  crank:
    desc: 1-bit crank dial in the simulator (Playdate screen). Mouse wheel or Q/E turns, X inverts
    cmds:
      - cargo run -p game-toolkit-handheld-demos --example crank

  run:
    desc: Run any example in the simulator (task run EXAMPLE=maze)
    requires:
      vars: [EXAMPLE]
    cmds:
      - cargo run -p game-toolkit-handheld-demos --example {{.EXAMPLE}}

  shots:
    desc: Screenshot every example headlessly into target/shots/
    cmds:
      - mkdir -p {{.SHOT_DIR}}
      - for: [maze, crank]
        cmd: HANDHELD_SHOT={{.SHOT_DIR}}/{{.ITEM}}.png cargo run -q -p game-toolkit-handheld-demos --example {{.ITEM}}
      - ls -1 {{.SHOT_DIR}}

  docs:open:
    desc: Build the API docs and open them in the browser
    cmds:
      - cargo doc --workspace --all-features --no-deps --open

  # --- Targets ----------------------------------------------------------------------------

  targets:
    desc: Install the Rust targets the checks build for
    cmds:
      - rustup target add thumbv7em-none-eabihf riscv32imac-unknown-none-elf wasm32-unknown-unknown

  check:nostd:
    desc: Build the no_std core for the Playdate CPU (Cortex-M7) and ESP32-C/P RISC-V
    cmds:
      - cargo clippy -p game-toolkit-handheld -p game-toolkit-handheld-demos --lib --target thumbv7em-none-eabihf --locked -- -D warnings
      - cargo build -p game-toolkit-handheld -p game-toolkit-handheld-demos --lib --target riscv32imac-unknown-none-elf --locked

  check:wasm:
    desc: Clippy the simulator and examples for the browser (wasm32)
    cmds:
      - cargo clippy --target wasm32-unknown-unknown --workspace --all-targets --all-features --locked -- -D warnings

  doctor:
    desc: Show which toolchains and SDKs for the device backends are installed
    silent: true
    cmds:
      - |
        have() { if command -v "$1" >/dev/null 2>&1; then echo "  ok      $1"; else echo "  missing $1  ($2)"; fi; }
        dir()  { if [ -d "$1" ]; then echo "  ok      $2: $1"; else echo "  missing $2: $1"; fi; }
        echo "Simulator:"
        have cargo "rustup.rs"
        have trunk "cargo install trunk --locked"
        echo "Rust targets:"
        for t in thumbv7em-none-eabihf riscv32imac-unknown-none-elf wasm32-unknown-unknown; do
          if rustup target list --installed | grep -qx "$t"; then echo "  ok      $t"; else echo "  missing $t  (task targets)"; fi
        done
        echo "Playdate (#1):"
        dir "{{.PLAYDATE_SDK}}" "Playdate SDK (PLAYDATE_SDK_PATH)"
        echo "ESP32-S3 (#3):"
        have espup "cargo install espup --locked"
        have espflash "cargo install espflash --locked"
        have wokwi-cli "https://docs.wokwi.com/wokwi-ci/cli-installation"
        echo "Kode Dot (#4):"
        have ldproxy "cargo install ldproxy --locked"
        have idf.py "ESP-IDF >= 5.3, or let esp-idf-sys fetch it"
        dir "{{.KODE_SDK}}" "Kode SDK (KODE_SDK_PATH)"

  # --- Playdate (boards/playdate) ---------------------------------------------------------
  # Plain cargo + the SDK's pdc; cargo-playdate can't read edition-2024 manifests. The board pins
  # an older nightly (playdate-sys needs it), hence --ignore-rust-version.

  playdate:build:
    desc: Build the dial for the Playdate Simulator (boards/playdate/target/dial.pdx)
    dir: boards/playdate
    env:
      PLAYDATE_SDK_PATH: '{{.PLAYDATE_SDK}}'
    cmds:
      - cargo build --example dial --ignore-rust-version
      - rm -rf target/pdx-sim && mkdir -p target/pdx-sim && cp pdxinfo target/pdx-sim/ && cp target/debug/examples/libdial.so target/pdx-sim/pdex.so
      - '"$PLAYDATE_SDK_PATH/bin/pdc" target/pdx-sim target/dial.pdx'

  playdate:sim:
    desc: Run the dial in the Playdate Simulator
    dir: boards/playdate
    deps: [playdate:build]
    env:
      PLAYDATE_SDK_PATH: '{{.PLAYDATE_SDK}}'
    cmds:
      - '"$PLAYDATE_SDK_PATH/bin/PlaydateSimulator" "$PWD/target/dial.pdx"'

  playdate:device:
    desc: Build the dial for a real Playdate (boards/playdate/target/dial-device.pdx; sideload it)
    dir: boards/playdate
    env:
      PLAYDATE_SDK_PATH: '{{.PLAYDATE_SDK}}'
    cmds:
      - cargo rustc --release --example dial --crate-type bin --target thumbv7em-none-eabihf -Zbuild-std=core,alloc --ignore-rust-version
      - rm -rf target/pdx-device && mkdir -p target/pdx-device && cp pdxinfo target/pdx-device/ && cp target/thumbv7em-none-eabihf/release/examples/dial target/pdx-device/pdex.elf
      - '"$PLAYDATE_SDK_PATH/bin/pdc" target/pdx-device target/dial-device.pdx'

  # --- ESP32-S3 (boards/esp32s3) ----------------------------------------------------------

  s3:setup:
    desc: Install the Xtensa Rust toolchain (espup) and espflash
    cmds:
      - cargo install espup --locked
      - espup install --targets esp32s3
      - cargo install espflash --locked

  s3:build:
    desc: Build the ESP32-S3 maze examples (Embassy and blocking)
    dir: boards/esp32s3
    cmds:
      - . ~/export-esp.sh && cargo build --release --examples

  s3:wokwi:
    desc: Run the Embassy maze in Wokwi, screenshot to boards/esp32s3/target/wokwi-embassy.png (needs WOKWI_CLI_TOKEN)
    dir: boards/esp32s3
    deps: [s3:build]
    cmds:
      - wokwi-cli --timeout 8000 --timeout-exit-code 0 --screenshot-part lcd1 --screenshot-time 6000 --screenshot-file target/wokwi-embassy.png

  s3:wokwi:blocking:
    desc: Run the superloop maze in Wokwi, screenshot to boards/esp32s3/target/wokwi-blocking.png
    dir: boards/esp32s3
    deps: [s3:build]
    cmds:
      - wokwi-cli wokwi-blocking --diagram-file ../diagram.json --timeout 8000 --timeout-exit-code 0 --screenshot-part lcd1 --screenshot-time 6000 --screenshot-file target/wokwi-blocking.png

  s3:flash:
    desc: Flash a real ESP32-S3 board and open the serial monitor (BIN=maze-blocking for the superloop example)
    dir: boards/esp32s3
    vars:
      BIN: '{{.BIN | default "maze-embassy"}}'
    cmds:
      - . ~/export-esp.sh && cargo run --release --example {{.BIN}}

  # --- Kode Dot (boards/kode-dot) ---------------------------------------------------------
  # ESP-IDF 6.1.1 through esp-idf-sys; the board pins nightly-2026-10-14 (newer std breaks on
  # espidf). The first build downloads ESP-IDF into boards/kode-dot/.embuild.

  kode:setup:
    desc: Install ldproxy, espflash and the pinned nightly for the Kode Dot
    cmds:
      - cargo install ldproxy espflash --locked
      - rustup toolchain install nightly-2026-10-14 --component rust-src,clippy,rustfmt

  kode:build:
    desc: Build the Kode Dot maze app image (boards/kode-dot/target/.../examples/maze.bin)
    dir: boards/kode-dot
    vars:
      OUT: target/riscv32imafc-esp-espidf/release/examples
    cmds:
      - cargo build --release --example maze
      - espflash save-image --chip esp32p4 {{.OUT}}/maze {{.OUT}}/maze.bin

  kode:wokwi:
    desc: Run the maze on Wokwi's ESP32-P4 with the CO5300 on SPI, screenshot to boards/kode-dot/target/wokwi.png
    dir: boards/kode-dot
    # Own target dir: the wokwi build has a different sdkconfig (no PSRAM), and sharing one dir
    # would rebuild ESP-IDF on every switch between the two.
    env:
      CARGO_TARGET_DIR: target/wokwi
      ESP_IDF_SDKCONFIG_DEFAULTS: sdkconfig.defaults;sdkconfig.wokwi
    deps: [kode:wokwi:chips]
    vars:
      OUT: target/wokwi/riscv32imafc-esp-espidf/release
    cmds:
      - cargo build --release --features wokwi --example maze
      - espflash save-image --chip esp32p4 --merge --bootloader {{.OUT}}/build/bootloader.bin --partition-table {{.OUT}}/build/partition-table.bin {{.OUT}}/examples/maze {{.OUT}}/examples/maze-wokwi.bin
      - wokwi-cli --timeout 20000 --timeout-exit-code 0 --screenshot-part lcd --screenshot-time 19000 --screenshot-file target/wokwi.png --serial-log-file target/wokwi-serial.log .

  kode:wokwi:chips:
    desc: Fetch the CO5300, TCA6408A and CST820 Wokwi chips from their GitHub releases into boards/kode-dot/target/chips
    internal: true
    dir: boards/kode-dot/target/chips
    vars:
      CHIPS: co5300@v0.1.0 tca6408a@v0.1.0 cst820@v0.2.2
    status:
      - test -f co5300.chip.wasm -a -f tca6408a.chip.wasm -a -f cst820.chip.wasm
    cmds:
      - for: { var: CHIPS, split: " " }
        cmd: |
          name={{splitList "@" .ITEM | first}}; tag={{splitList "@" .ITEM | last}}
          curl -fsSL -o $name.zip https://github.com/sunsided/$name/releases/download/$tag/chip.zip
          unzip -oq $name.zip && mv chip.json $name.chip.json && mv chip.wasm $name.chip.wasm && rm $name.zip

  kode:flash:
    desc: Write the app into the Kode Dot's app_pending mailbox (0x1A00000); kodeOS adopts it on next boot
    dir: boards/kode-dot
    deps: [kode:build]
    prompt: Write maze.bin to 0x1A00000 on the connected Kode Dot? (never to 0x0, that would overwrite kodeOS)
    cmds:
      - espflash write-bin 0x1A00000 target/riscv32imafc-esp-espidf/release/examples/maze.bin

  # --- Quality gate -----------------------------------------------------------------------

  test:
    desc: Run tests and doctests
    cmds:
      - cargo test --workspace --locked {{.CLI_ARGS}}

  lint:
    desc: Clippy with warnings denied (host, all features)
    cmds:
      - cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

  fmt:
    desc: Format the workspace
    cmds:
      - cargo fmt --all

  docs:
    desc: Build documentation with warnings denied
    env:
      RUSTDOCFLAGS: '-D warnings'
    cmds:
      - cargo doc --workspace --all-features --no-deps --locked

  check:
    desc: Everything CI checks - fmt, clippy (host, no_std, wasm32), docs
    cmds:
      - cargo fmt --all --check
      - task: lint
      - task: check:nostd
      - task: check:wasm
      - task: docs

  ci:
    desc: Run checks and tests
    cmds:
      - task: check
      - task: test
