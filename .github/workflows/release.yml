---
name: Release

# One tag per crate and version: `<crate>-v<version>`, e.g. game-toolkit-handheld-v0.2.0 or
# game-toolkit-handheld-kode-dot-v0.1.0-alpha.2. The crates are versioned independently.
on:
  push:
    tags:
      - 'game-toolkit-handheld*-v[0-9]*'

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Package, verify and attest
    runs-on: ubuntu-latest
    permissions:
      contents: read # check out the repository
      id-token: write # sign the provenance attestation
      attestations: write # store the provenance attestation
    outputs:
      crate: ${{ steps.tag.outputs.crate }}
      version: ${{ steps.tag.outputs.version }}
      dir: ${{ steps.tag.outputs.dir }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Resolve the crate from the tag
        id: tag
        run: |
          crate="${GITHUB_REF_NAME%-v*}"
          version="${GITHUB_REF_NAME##*-v}"
          case "$crate" in
            game-toolkit-handheld) dir=crates/handheld ;;
            game-toolkit-handheld-kode-dot) dir=boards/kode-dot ;;
            game-toolkit-handheld-esp32s3) dir=boards/esp32s3 ;;
            *) echo "::error::no crate $crate in this repository"; exit 1 ;;
          esac
          manifest_version=$(cargo metadata --manifest-path "$dir/Cargo.toml" --no-deps --format-version 1 \
            | jq -r --arg crate "$crate" '.packages[] | select(.name == $crate) | .version')
          if [ "$manifest_version" != "$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match $crate $manifest_version"
            exit 1
          fi
          {
            echo "crate=$crate"
            echo "version=$version"
            echo "dir=$dir"
          } >> "$GITHUB_OUTPUT"

      # Each board brings its own toolchain; the core builds on stable.
      - name: Toolchain for the Kode Dot (pinned nightly, ldproxy)
        if: steps.tag.outputs.crate == 'game-toolkit-handheld-kode-dot'
        working-directory: boards/kode-dot
        run: |
          rustup toolchain install # from rust-toolchain.toml
          cargo install ldproxy --locked
      - name: Toolchain for the ESP32-S3 (Xtensa)
        if: steps.tag.outputs.crate == 'game-toolkit-handheld-esp32s3'
        uses: esp-rs/xtensa-toolchain@ec6d36527049a7f4fb2cb0c1a644668c1bb8a2a4 # v1.7.0
        with:
          buildtargets: esp32s3
          default: false
          override: false

      # Run in the crate's directory, so its .cargo/config.toml and rust-toolchain.toml apply.
      # `cargo package` builds the packaged crate against its crates.io dependencies.
      - name: Package and verify
        working-directory: ${{ steps.tag.outputs.dir }}
        env:
          CRATE: ${{ steps.tag.outputs.crate }}
        run: cargo package --locked -p "$CRATE"
      - name: Collect the crate file
        env:
          CRATE: ${{ steps.tag.outputs.crate }}
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          mkdir -p dist
          # Boards are their own workspaces with their own target dir; the core uses the root one.
          find . -path "*/target/package/$CRATE-$VERSION.crate" -exec cp {} dist/ \;
          ls -l dist
          test -f "dist/$CRATE-$VERSION.crate"
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.crate
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets
          path: dist/*.crate
          if-no-files-found: error

  publish:
    name: Publish to crates.io
    needs:
      - build
    runs-on: ubuntu-latest
    # The crates.io trusted publishers are bound to this environment.
    environment: crates-io
    permissions:
      contents: read # check out the repository
      id-token: write # exchange the OIDC token for a short-lived crates.io token
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check whether the version is already on crates.io
        id: pending
        env:
          CRATE: ${{ needs.build.outputs.crate }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          status=$(curl -s -o /dev/null -w '%{http_code}' -A "sunsided/game-toolkit-handheld release workflow" \
            "https://crates.io/api/v1/crates/$CRATE/$VERSION")
          if [ "$status" = "200" ]; then
            echo "$CRATE $VERSION is already published, skipping"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Authenticate with crates.io
        if: steps.pending.outputs.publish == 'true'
        id: auth
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
      - name: Publish
        if: steps.pending.outputs.publish == 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
          MANIFEST: ${{ needs.build.outputs.dir }}/Cargo.toml
          CRATE: ${{ needs.build.outputs.crate }}
        # The build job verified this commit's package with the board's toolchain. Publishing
        # from the repository root on stable skips that build (ESP-IDF takes ~15 minutes) and
        # keeps the boards' nightly-only .cargo/config.toml out of the way.
        run: cargo publish --locked --no-verify --manifest-path "$MANIFEST" -p "$CRATE"

  github-release:
    name: Create GitHub Release
    needs:
      - build
      - publish
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub Release
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: dist
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          CRATE: ${{ needs.build.outputs.crate }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          prerelease=""
          case "$VERSION" in *-*) prerelease="--prerelease" ;; esac
          # shellcheck disable=SC2086 # prerelease is empty or one flag.
          gh release create "$GITHUB_REF_NAME" --title "$CRATE $VERSION" --generate-notes \
            --verify-tag $prerelease --repo "$GITHUB_REPOSITORY" dist/*
